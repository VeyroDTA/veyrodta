    <!--
      LocalBusiness şeması (schema.org): Google'ın işletmeyi anlamasına ve yerel
      aramalarda (ör. "Silivri web tasarım", "İstanbul web tasarım") bir işletme
      kartı/bilgi paneli olarak göstermesine yardımcı olur.

      DİKKAT: Buradaki telephone/email/address, src/config.js'teki değerlerle
      aynı olmalı — orayı değiştirirsen burayı da elle güncellemen gerekir
      (index.html statik bir dosya, config.js'i build zamanında okumuyor).
      Domain bağlandığında "url" ve "image" alanlarını da güncelle.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "UGR Studio",
        "image": "https://www.ugrstudio.com.tr/og-image.jpg",
        "logo": "https://www.ugrstudio.com.tr/icon-512.png",
        "url": "https://www.ugrstudio.com.tr/",
        "telephone": "+905394500402",
        "email": "iletisim@ugrstudio.com.tr",
        "priceRange": "5.999₺ - 11.999₺",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Mimar Sinan 3. Etap",
          "addressLocality": "Silivri",
          "addressRegion": "İstanbul",
          "postalCode": "34570",
          "addressCountry": "TR"
        },
        "areaServed": [
          { "@type": "City", "name": "İstanbul" },
          { "@type": "Country", "name": "Türkiye" }
        ],
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "09:00",
          "closes": "18:00"
        }
      }
    </script>

    <!--
      Font: Manrope artık KENDİ sunucumuzdan geliyor (public/fonts/).
      Neden: Google Fonts üzerinden çekildiğinde Lighthouse canlı
      ölçümde 891 ms render-blocking istek olarak ölçtü. Üçüncü taraf
      CSS + DNS + TLS zinciri kalkınca o gecikme gitti; dosyalar zaten
      kullandığımız Worker'dan servis ediliyor, ek servis/ücret yok.

      Manrope OFL 1.1 lisanslı (ticari kullanım dahil bedava).

      İKİ dosya preload ediliyor, çünkü ikisi de her sayfada gerekiyor:
        manrope-latin.woff2      → U+0000-00FF (ç, ö, ü, ı ...)
        manrope-latin-ext.woff2  → ş, ğ, İ ... (latin bloğunda YOK)
      Sadece latin yüklenirse Türkçe karakterler bozuk görünür.

      preload, tarayıcıya bu iki dosyayı CSS'ten bağımsız olarak hemen
      başlatmasını söyler. @font-face tanımları src/index.css içinde.
      font-display: swap → font gelene kadar sistem yazı tipi kullanılır,
      metin hiçbir zaman görünmez olmaz (FOUT yok).
    -->
    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-latin-ext.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--

      Realtime raporunda kendi ziyaretini görmek için: analytics.google.com →
      Rapor → Anlık.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-REY1DWBF4C"></script>
    <script>

      gtag('config', 'G-REY1DWBF4C', { send_page_view: false });
    </script>
