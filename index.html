<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040814" />

    <!-- TODO: Site yayına girince başlığı/açıklamayı gözden geçir, src/config.js içindeki SITE_URL'i güncelle -->
    <title>UGR Studio | Kurumsal Web Tasarım & Dijital Çözümler</title>

    <!-- Open Graph / WhatsApp, Facebook paylaşım önizlemesi -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="UGR Studio" />
    <meta property="og:title" content="UGR Studio | Kurumsal Web Tasarım & Dijital Çözümler" />
    <meta
      property="og:description"
      content="Web sitenizi değil işinizi tasarlıyoruz. Kurumsal web, e-ticaret ve randevu sistemleri için şeffaf fiyatlarla anahtar teslim çözümler."
    />
    <meta property="og:image" content="https://www.ugrstudio.com.tr/og-image.jpg" />

    <!-- Twitter/X paylaşım önizlemesi -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UGR Studio | Kurumsal Web Tasarım & Dijital Çözümler" />
    <meta
      name="twitter:description"
      content="Web sitenizi değil işinizi tasarlıyoruz. Kurumsal web, e-ticaret ve randevu sistemleri için şeffaf fiyatlarla anahtar teslim çözümler."
    />
    <meta name="twitter:image" content="https://www.ugrstudio.com.tr/og-image.jpg" />

    <!--
      LocalBusiness şeması (schema.org): Google'ın işletmeyi anlamasına ve yerel
      aramalarda (ör. "Silivri web tasarım", "İstanbul web tasarım") bir işletme
      kartı/bilgi paneli olarak göstermesine yardımcı olur.

      DİKKAT: Buradaki telephone/email/address, src/config.js'teki değerlerle
      aynı olmalı — orayı değiştirirsen burayı da elle güncellemen gerekir
      (index.html statik bir dosya, config.js'i build zamanında okumuyor).
      Domain bağlandığında "url" ve "image" alanlarını da güncelle.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "UGR Studio",
        "image": "https://www.ugrstudio.com.tr/og-image.jpg",
        "logo": "https://www.ugrstudio.com.tr/icon-512.png",
        "url": "https://www.ugrstudio.com.tr/",
        "telephone": "+905394500402",
        "email": "iletisim@ugrstudio.com.tr",
        "priceRange": "13.900₺ - 49.900₺",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Mimar Sinan 3. Etap",
          "addressLocality": "Silivri",
          "addressRegion": "İstanbul",
          "postalCode": "34570",
          "addressCountry": "TR"
        },
        "areaServed": [
          { "@type": "City", "name": "İstanbul" },
          { "@type": "Country", "name": "Türkiye" }
        ],
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "09:00",
          "closes": "18:00"
        }
      }
    </script>

    <!--
      Font: Eskiden App.jsx içinde bir <style> etiketi içinde @import olarak
      yükleniyordu, bu da React mount olana kadar isteğin başlamamasına yol
      açıyordu (görünür metin gecikmesi / FOUT). Burada erkenden ve doğrudan
      yükleniyor. 6 ağırlık yerine gerçekten kullanılan 3 tanesi bırakıldı.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    />

    <!--
      Google Analytics 4 — kuruldu (Ölçüm Kimliği: G-REY1DWBF4C).
      Realtime raporunda kendi ziyaretini görmek için: analytics.google.com →
      Rapor → Anlık.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-REY1DWBF4C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      // send_page_view kapalı: sayfa görüntülemeleri src/components/ScrollToTop.jsx
      // tarafından her rota değişiminde manuel gönderiliyor (SPA olduğu için gerekli).
      gtag('config', 'G-REY1DWBF4C', { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
